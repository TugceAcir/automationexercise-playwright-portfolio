version: 2

# Version updates are PAUSED (2026-10-13): every entry below sets
# `open-pull-requests-limit: 0`. This repository is a finished portfolio piece
# that is shown rather than actively developed, and each Dependabot pull request
# fires a 15-minute live gate against a public demo site this repository does
# not control - traffic and queue contention for updates nobody is there to
# review. The committed lockfiles and `npm ci` keep every run reproducible in
# the meantime, and Dependabot alerts stay enabled, so a real advisory is still
# reported.
# To resume: delete the three `open-pull-requests-limit` lines. The schedules,
# groups and the TypeScript-major hold are kept intact for that reason.
updates:
  - package-ecosystem: npm
    directory: /
    open-pull-requests-limit: 0
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch
    ignore:
      # TypeScript majors are held until the lint toolchain can accept them.
      # typescript-eslint pins a `typescript` peer range (>=4.8.4 <6.1.0 as of
      # 8.70.0), so a TS 7 bump fails `npm ci` with ERESOLVE before a single
      # check runs - see the closed #40. Forcing it past that with
      # --legacy-peer-deps would run the type-aware rules, including the ADR
      # 0001 boundary rule, against a compiler the plugin does not support:
      # lint would stay green while checking less.
      # Remove this entry once typescript-eslint publishes a peer range
      # admitting the next major, and move both packages in one pull request.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major

  # The isolated API contract package keeps its own lockfile. Same schedule, grouping and
  # TypeScript-major hold as the root, for the same typescript-eslint peer-range reason.
  - package-ecosystem: npm
    directory: /api-contract
    open-pull-requests-limit: 0
    schedule:
      interval: weekly
    groups:
      api-contract-npm-minor-patch:
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: typescript
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    open-pull-requests-limit: 0
    schedule:
      interval: weekly
    groups:
      actions-minor-patch:
        update-types:
          - minor
          - patch
