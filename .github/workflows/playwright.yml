name: Playwright Portfolio Tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: automationexercise-public-demo-site
  cancel-in-progress: false

jobs:
  e2e:
    name: Quality Gate and Smoke Session
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      WORKERS: 1
      RETRIES: 2

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Record execution environment
        run: |
          node -e "const p=process.env; console.log(JSON.stringify({ platform: process.platform, architecture: process.arch, node: process.version, commit: p.GITHUB_SHA, baseUrl: p.BASE_URL ?? 'https://automationexercise.com', workers: p.WORKERS, retries: p.RETRIES }, null, 2))"
          npx playwright --version

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit test report tooling
        run: npm run test:unit

      - name: Check generated coverage counts
        run: npm run coverage:check

      - name: Preflight public demo site
        run: npm run demo-site:preflight

      - name: Run informational accessibility scans
        continue-on-error: true
        run: npm run test:a11y

      - name: Run smoke and session gate
        run: npm run test:cross-platform

      - name: Summarize failed tests
        if: failure()
        run: npm run triage:failures

      - name: Add failure triage to job summary
        if: failure()
        run: cat test-results/failure-triage.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 3

      - name: Upload accessibility evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: accessibility-results
          path: accessibility-results/
          if-no-files-found: ignore
          retention-days: 3

      - name: Upload raw test results
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 3
