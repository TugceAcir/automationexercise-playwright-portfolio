name: Playwright Portfolio Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  e2e:
    name: Headless E2E and Business Report
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Record execution environment
        run: |
          node -e "const p=process.env; console.log(JSON.stringify({ platform: process.platform, architecture: process.arch, node: process.version, commit: p.GITHUB_SHA, baseUrl: p.BASE_URL ?? 'https://automationexercise.com', workers: p.WORKERS ?? (p.CI ? '2' : '1'), retries: p.RETRIES ?? (p.CI ? '2' : '0') }, null, 2))"
          npx playwright --version

      - name: Restore business report history
        uses: actions/cache@v4
        with:
          path: business-report/history.json
          key: business-report-history-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            business-report-history-${{ github.ref_name }}-

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit test report tooling
        run: npm run test:unit

      - name: Check generated coverage counts
        run: npm run coverage:check

      - name: Run headless tests
        run: npm test

      - name: Summarize failed tests
        if: failure()
        run: npm run triage:failures

      - name: Add failure triage to job summary
        if: failure()
        run: cat test-results/failure-triage.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload business report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: business-report
          path: business-report/
          retention-days: 30

      - name: Upload raw test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 14

      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: business-report/

  deploy:
    name: Publish Business Report
    needs: e2e
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
